[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-research"
version = "0.5.0"
description = "Multi-Agent Research System: автономное глубокое исследование на Claude"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.7", "pydantic>=2.7", "pyyaml>=6.0", "markdown>=3.5", "httpx>=0.27"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "fpdf2>=2.7", "python-docx>=1.1"]
export = ["fpdf2>=2.7", "python-docx>=1.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "fastapi>=0.110", "uvicorn>=0.29",
       "python-multipart>=0.0.9", "fpdf2>=2.7", "python-docx>=1.1"]

[project.scripts]
mars = "mars.cli:main"

[tool.setuptools.packages.find]
include = ["mars*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"mars/report_html.py" = ["E501"]   # встроенные CSS/JS
"mars/web/app.py" = ["E501", "B008"]
