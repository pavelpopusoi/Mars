# Эталонные вопросы для `mars eval`. must_mention — темы, без которых ответ неполон
# (проверяется наличие слов в отчёте, регистр не важен). Дополняйте своими вопросами.
questions:
  - id: battery
    question: Сможет ли натрий-ионная технология вытеснить LFP в стационарных накопителях энергии к 2030 году?
    must_mention: [плотность энергии, стоимость, CATL, литий]
  - id: microbiome
    question: Насколько убедительны доказательства причинной связи между микробиомом кишечника и депрессией?
    must_mention: [рандомизирован, пробиотик, ось кишечник, причин]
  - id: ubi
    question: Что говорит доказательная база о влиянии безусловного базового дохода на занятость?
    must_mention: [Финлянди, Кени, занятост, пилот]
  - id: heat
    question: Как рост температуры влияет на производительность труда и ВВП в странах с жарким климатом?
    must_mention: [производительност, ВВП, адаптаци, сельск]
  - id: vertical-farms
    question: Почему многие вертикальные фермы обанкротились в 2023–2025 годах и при каких условиях их экономика сходится?
    must_mention: [электроэнерг, капитал, AeroFarms, салат]
